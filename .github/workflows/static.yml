# Builds and publishes the site to GitHub Pages.
# Runs when anything is pushed (including uploads from the Manage site page),
# every night to refresh the INSPIRE-HEP paper list, and on demand.
name: Build and deploy site

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 2 * * *"      # every night, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install pillow pillow-heif

      - name: Process new photos
        run: python scripts/process_photos.py

      - name: Save new photos to the repository
        run: |
          git config user.name "site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/gallery.json assets/img photos
          if ! git diff --cached --quiet; then
            git commit -m "Process uploaded photos [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Refresh paper list from INSPIRE-HEP
        continue-on-error: true
        run: python scripts/fetch_inspire.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
